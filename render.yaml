# Render Free Web Service (no Docker, no worker — BackgroundTasks run in-process).
# Dashboard: connect this repo, set env vars below, deploy on push to main.
services:
  - type: web
    name: resumeiq-api
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT"
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_EMBED_MODEL
        value: text-embedding-004
      - key: GEMINI_TIER
        value: free
      - key: BACKEND_CORS_ORIGINS
        sync: false
